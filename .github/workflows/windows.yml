# Builds the Windows executable on a GitHub-hosted runner.
# - every push / pull request: build, run the tests, keep the zip as a workflow artifact
# - a pushed tag "v*" (e.g. v0.2.0): also attach the zip to a GitHub release
name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release on tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        shell: cmd
        run: |
          python -m pip install .[test]
          python -m pytest -q

      - name: Build executable
        shell: cmd
        run: packaging\build_windows.bat

      - uses: actions/upload-artifact@v4
        with:
          name: PNScope-windows
          path: dist/PNScope-*-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PNScope-*-windows.zip
