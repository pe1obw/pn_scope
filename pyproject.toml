[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pnscope"
dynamic = ["version"]
description = "Phase-noise measurements and analysis with a spectrum analyzer (no PN option needed)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PySide6-Essentials>=6.5", "pyqtgraph>=0.13", "matplotlib>=3.7", "pyserial>=3.5"]

[project.optional-dependencies]
test = ["pytest"]
# PlutoSDR driver; needs the libiio system library (Linux: package libiio0, Windows: ADI's
# libiio installer). Use pylibiio 0.25 with libiio 0.2x, pylibiio 1.0 with libiio 1.x.
pluto = ["pylibiio>=0.25,<1"]

[project.scripts]
pnscope = "pnscope.gui.app:main"

[tool.setuptools.dynamic]
version = {attr = "pnscope.__version__"}

[tool.setuptools.packages.find]
include = ["pnscope*"]
