[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pnscope"
dynamic = ["version"]
description = "Phase-noise measurements and analysis with a spectrum analyzer (no PN option needed)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PySide6-Essentials>=6.5", "pyqtgraph>=0.13", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
pnscope = "pnscope.gui.app:main"

[tool.setuptools.dynamic]
version = {attr = "pnscope.__version__"}

[tool.setuptools.packages.find]
include = ["pnscope*"]
